# =============================================================================
# Build toolchain & SDK
# =============================================================================
[versions]
agp = "9.0.1"
kotlin = "2.3.21"
java = "17"
minSdk = "24"
compileSdk = "36"
targetSdk = "35"

# =============================================================================
# Core — AndroidX / Jetpack / Kotlin official
# =============================================================================
coreKtx = "1.18.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.05.00"
coreSplashscreen = "1.2.0"
navigationCompose = "2.9.8"
webkit = "1.16.0"
coroutinesCore = "1.11.0"

# Core — test (AndroidX)
junitVersion = "1.3.0"
espressoCore = "3.7.0"

# =============================================================================
# Google services (Firebase, Play, Places, Accompanist)
# =============================================================================
googleService = "4.4.2"
firebaseBom = "34.2.0"
googleAuth = "21.3.0"
places = "3.3.0"
accompanistSystemUiController = "0.36.0"

# =============================================================================
# External — third-party libraries
# =============================================================================
koinCompose = "3.5.6"
gson = "2.13.1"
retrofit = "2.11.0"
okhttp3 = "4.12.0"
coil = "2.7.0"
glide = "4.16.0"
compressor = "3.0.1"
socketIOClient = "2.1.0"
lottieCompose = "6.7.1"
junit = "4.13.2"

# =============================================================================
[libraries]
# --- Core: AndroidX / Jetpack ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# --- Core: Compose (BOM) ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# --- Core: Kotlin ---
coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutinesCore" }

# --- Core: test ---
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# --- Google ---
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
google-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "googleAuth" }
google-places = { module = "com.google.android.libraries.places:places", version.ref = "places" }
google-accompanist-systemuicontroller = { module = "com.google.accompanist:accompanist-systemuicontroller", version.ref = "accompanistSystemUiController" }

# --- External: DI ---
koin-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koinCompose" }

# --- External: networking ---
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofitConvertGson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp3 = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp3" }
okhttp3LoggingInterceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp3" }
socket-io-client = { group = "io.socket", name = "socket.io-client", version.ref = "socketIOClient" }

# --- External: UI / media ---
io-coil = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }
compressor = { module = "id.zelory:compressor", version.ref = "compressor" }
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottieCompose" }

# --- External: test ---
junit = { group = "junit", name = "junit", version.ref = "junit" }

# =============================================================================
[plugins]
# Build
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Google
google-service = { id = "com.google.gms.google-services", version.ref = "googleService" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version = "3.0.6" }
